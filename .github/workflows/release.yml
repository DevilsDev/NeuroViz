# =============================================================================
# NeuroViz Semantic Release Automation
# =============================================================================
# Triggered on:
#   - Successful completion of the CI/CD workflow for a push to main.
#     Releases are gated on lint, typecheck, unit tests and build passing,
#     and are cut from the exact commit CI validated. If main has moved on
#     since, semantic-release skips (branch not up to date) and the newer
#     commit's own CI run releases instead.
#
# Purpose:
#   - Automatically determine version bump based on commit messages
#   - Generate CHANGELOG.md
#   - Create GitHub releases with release notes
#   - Tag releases in git
#
# Commit Message Format (Conventional Commits):
#   - feat: new feature (minor version bump)
#   - fix: bug fix (patch version bump)
#   - perf: performance improvement (patch version bump)
#   - docs: documentation changes (no version bump)
#   - chore: maintenance tasks (no version bump)
#   - BREAKING CHANGE: in footer (major version bump)
# =============================================================================

name: Release

on:
  workflow_run:
    workflows: ['CI/CD']
    types: [completed]
    branches: [main]

# Never run two releases at once, and never cancel one mid-publish
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only release pushes to main whose CI run succeeded, and honour
    # [skip ci] / [skip release] in the commit message
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
      !contains(github.event.workflow_run.head_commit.message, '[skip release]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}  # the commit CI validated
          fetch-depth: 0  # Fetch all history for semantic versioning
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'  # semantic-release requires Node 22+ or 24+
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build the bundle published as release assets (.releaserc.json: dist/**)
      - name: Build
        run: npm run build

      # -----------------------------------------------------------------------
      # Semantic Release
      # -----------------------------------------------------------------------
      - name: Run semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
