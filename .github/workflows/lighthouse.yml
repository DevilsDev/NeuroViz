# =============================================================================
# NeuroViz Lighthouse CI - Performance Monitoring
# =============================================================================
# Triggered on:
#   - Pull requests to main branch
#   - Push to main branch
#
# Purpose:
#   - Monitor web performance metrics
#   - Enforce performance budgets
#   - Track accessibility, SEO, and best practices
#   - Detect performance regressions before merge
# =============================================================================

name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Superseded runs for the same ref are cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # -----------------------------------------------------------------------
      # Cache node_modules for faster build
      # -----------------------------------------------------------------------
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      # -----------------------------------------------------------------------
      # Build the application
      # -----------------------------------------------------------------------
      - name: Build application
        run: npm run build
        env:
          GITHUB_ACTIONS: true

      # -----------------------------------------------------------------------
      # Run Lighthouse CI
      # -----------------------------------------------------------------------
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            http://localhost:5173/NeuroViz/
          uploadArtifacts: true
          # Reports are kept as workflow artifacts; don't publish them to
          # Lighthouse's temporary public storage
          temporaryPublicStorage: false
          configPath: '.lighthouserc.json'

      # -----------------------------------------------------------------------
      # Upload Lighthouse results as artifacts
      # -----------------------------------------------------------------------
      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: '.lighthouseci/'
          retention-days: 30
