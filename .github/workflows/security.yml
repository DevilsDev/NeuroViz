# =============================================================================
# NeuroViz Security Scanning Pipeline
# =============================================================================
# Triggered on:
#   - Push to main branch
#   - Pull requests to main branch
#   - Weekly schedule (Mondays at 9 AM UTC)
#
# Pipeline stages:
#   1. Dependency Vulnerability Scan (npm audit)
#      - BLOCKING: high/critical advisories in production dependencies
#      - Advisory: full report (incl. dev dependencies, moderate+) in summary
#   2. Secret Scanning (TruffleHog, verified secrets only)
#   3. SAST Analysis (CodeQL security-extended)
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

# Minimal permissions by default
permissions:
  contents: read

jobs:
  # ===========================================================================
  # Job 1: Dependency Vulnerability Scanning
  # ===========================================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For uploading to GitHub Security tab

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Run npm audit for vulnerability scanning
      # -----------------------------------------------------------------------
      # Advisory: full report including dev tooling. Never fails the job.
      - name: npm audit report (all dependencies)
        run: |
          echo "## NPM Audit Report (all dependencies)" >> $GITHUB_STEP_SUMMARY
          if npm audit --audit-level=moderate > audit-full.txt; then
            echo "✅ No moderate+ vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Vulnerabilities found in dependencies (see summary)"
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat audit-full.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # Blocking: high/critical advisories in code that ships to users
      - name: npm audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

      # -----------------------------------------------------------------------
      # Verify package-lock.json integrity
      # -----------------------------------------------------------------------
      - name: Verify lockfile integrity
        run: npm ci --ignore-scripts

      # -----------------------------------------------------------------------
      # Optional: Snyk scanning (requires SNYK_TOKEN secret)
      # Uncomment when SNYK_TOKEN is added to repository secrets
      # -----------------------------------------------------------------------
      # - name: Run Snyk security scan
      #   uses: snyk/actions/node@master
      #   continue-on-error: true
      #   env:
      #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      #   with:
      #     args: --severity-threshold=high --json-file-output=snyk-report.json
      #
      # - name: Upload Snyk report
      #   uses: actions/upload-artifact@v7
      #   if: always()
      #   with:
      #     name: snyk-report
      #     path: snyk-report.json
      #     retention-days: 30

  # ===========================================================================
  # Job 2: Secret Scanning with TruffleHog
  # ===========================================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for comprehensive scanning

      # -----------------------------------------------------------------------
      # TruffleHog - Free open-source secret scanner
      # -----------------------------------------------------------------------
      - name: Run TruffleHog secret scan
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6 # v3.94.3
        with:
          # Scan the entire git history
          path: ./
          base: ""
          head: ${{ github.ref }}
          extra_args: --only-verified --json

  # ===========================================================================
  # Job 3: SAST (Static Application Security Testing)
  # ===========================================================================
  sast-scan:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For CodeQL uploads

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # CodeQL Analysis for JavaScript/TypeScript
      # -----------------------------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      # Note: the former "ESLint security" step was removed. No security plugin
      # is configured, so it only re-ran the regular lint (already blocking in
      # CI) with failures suppressed. CodeQL above is the SAST gate.
